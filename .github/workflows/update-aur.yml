name: Update AUR Package

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force AUR deploy even if versions match'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.check.outputs.upstream }}
      bump: ${{ steps.check.outputs.bump }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scheduled and manual runs follow upstream; pushes and pull requests
      # only validate the checked-in PKGBUILD.
      - name: Check upstream version
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          UPSTREAM=$(curl -s "https://pypi.org/pypi/browser-use/json" | jq -r '.info.version')
          CURRENT=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          BUMP=false
          DEPLOY=false
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch)
              [ "$UPSTREAM" != "$CURRENT" ] && BUMP=true
              { [ "$BUMP" = true ] || [ "$FORCE" = true ]; } && DEPLOY=true
              ;;
          esac
          echo "upstream=$UPSTREAM current=$CURRENT bump=$BUMP deploy=$DEPLOY"
          {
            echo "upstream=$UPSTREAM"
            echo "bump=$BUMP"
            echo "deploy=$DEPLOY"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib python-packaging
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Checkout
        uses: actions/checkout@v4

      - name: Hand workspace to build user
        run: chown -R builder:builder .

      - name: Bump pkgver to upstream
        if: needs.check.outputs.bump == 'true'
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ needs.check.outputs.upstream }}/" PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          sudo -u builder -H updpkgsums

      - name: Build AUR-only dependencies
        run: |
          for pkg in python-uuid7 python-portalocker python-screeninfo; do
            sudo -u builder -H git clone --depth 1 "https://aur.archlinux.org/$pkg.git" "/home/builder/$pkg"
            sudo -u builder -H bash -c "cd /home/builder/$pkg && makepkg -si --noconfirm --nocheck"
          done

      - name: Build package
        run: |
          sudo -u builder -H makepkg -sf --noconfirm
          cp .SRCINFO /tmp/SRCINFO.checked-in
          sudo -u builder -H makepkg --printsrcinfo > .SRCINFO

      - name: Check .SRCINFO is up to date
        if: needs.check.outputs.bump != 'true'
        run: diff -u /tmp/SRCINFO.checked-in .SRCINFO

      - name: Check Python dependencies against PKGBUILD
        run: |
          mkdir -p /tmp/pkgroot
          tar -xf browser-use-cli-*.pkg.tar.zst -C /tmp/pkgroot
          python ci/check-deps.py /tmp/pkgroot .SRCINFO

      - name: Install and smoke test
        run: |
          pacman -U --noconfirm browser-use-cli-*.pkg.tar.zst
          browser-use --help

      - name: Upload PKGBUILD and .SRCINFO
        uses: actions/upload-artifact@v4
        with:
          name: pkgbuild
          path: |
            PKGBUILD
            .SRCINFO

  deploy:
    needs: [check, build]
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built PKGBUILD and .SRCINFO
        uses: actions/download-artifact@v4
        with:
          name: pkgbuild

      - name: Read package version
        id: version
        run: |
          PKGVER=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          PKGREL=$(grep '^pkgrel=' PKGBUILD | cut -d= -f2)
          echo "full=$PKGVER-$PKGREL" >> "$GITHUB_OUTPUT"

      - name: Commit and push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "feat: update to ${{ needs.check.outputs.upstream }}"
          git push

      - name: Deploy to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: browser-use-cli
          pkgbuild: ./PKGBUILD
          assets: |
            .SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.full }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
