name: Update AUR Package

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force AUR deploy even if versions match'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      bump: ${{ steps.check.outputs.bump }}
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib python-packaging
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Checkout
        uses: actions/checkout@v4

      - name: Hand workspace to build user
        run: chown -R builder:builder .

      # Scheduled and manual runs follow upstream; pushes and pull requests
      # only validate the checked-in PKGBUILD.
      - name: Check upstream version
        id: check
        run: |
          BUMP=false
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch)
              UPSTREAM=$(curl -s https://pypi.org/pypi/browser-use/json | python -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')
              CURRENT=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
              if [ "$UPSTREAM" != "$CURRENT" ]; then
                BUMP=true
              fi
              echo "current=$CURRENT"
              ;;
          esac
          { echo "upstream=$UPSTREAM"; echo "bump=$BUMP"; } | tee -a "$GITHUB_OUTPUT"

      - name: Bump pkgver to upstream
        if: steps.check.outputs.bump == 'true'
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.check.outputs.upstream }}/" PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          sudo -u builder -H updpkgsums

      - name: Build dependencies that are only in the AUR
        run: |
          for dep in $(sudo -u builder -H makepkg --printsrcinfo | sed -n 's/^\t\(make\)\?depends = //p' | sed 's/[<>=].*//'); do
            pacman -Si "$dep" > /dev/null 2>&1 && continue
            sudo -u builder -H git clone --depth 1 "https://aur.archlinux.org/$dep.git" "/home/builder/$dep"
            sudo -u builder -H makepkg -D "/home/builder/$dep" -si --noconfirm --nocheck
          done

      - name: Build package
        run: |
          sudo -u builder -H makepkg -sf --noconfirm
          sudo -u builder -H makepkg --printsrcinfo > .SRCINFO

      - name: Check .SRCINFO is up to date
        if: steps.check.outputs.bump != 'true'
        run: git diff --exit-code -- .SRCINFO

      - name: Check Python dependencies against PKGBUILD
        run: python ci/check-deps.py pkg/browser-use-cli

      - name: Install and smoke test
        run: |
          pacman -U --noconfirm browser-use-cli-*.pkg.tar.zst
          browser-use --help

      - name: Upload PKGBUILD and .SRCINFO
        if: steps.check.outputs.bump == 'true' || inputs.force
        uses: actions/upload-artifact@v4
        with:
          name: pkgbuild
          path: |
            PKGBUILD
            .SRCINFO

  deploy:
    needs: build
    if: needs.build.outputs.bump == 'true' || inputs.force
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built PKGBUILD and .SRCINFO
        uses: actions/download-artifact@v4
        with:
          name: pkgbuild

      - name: Read package version
        id: version
        run: |
          PKGVER=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          PKGREL=$(grep '^pkgrel=' PKGBUILD | cut -d= -f2)
          { echo "pkgver=$PKGVER"; echo "full=$PKGVER-$PKGREL"; } | tee -a "$GITHUB_OUTPUT"

      - name: Commit and push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "feat: update to ${{ steps.version.outputs.pkgver }}"
          git push

      - name: Deploy to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: browser-use-cli
          pkgbuild: ./PKGBUILD
          assets: |
            .SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.full }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
